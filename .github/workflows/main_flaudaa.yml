# Build and deploy API (Fulda.API) to Azure App Service: flaudaa
# Repo layout: solution lives under Fulda.API/, not the repository root.

name: Build and deploy ASP.Net Core app to Azure Web App - flaudaa

on:
  push:
    branches:
      - main
    paths:
      - 'Fulda.API/**'
      - '.github/workflows/main_flaudaa.yml'
  workflow_dispatch:

env:
  API_PROJECT: Fulda.API/Fulda.API/Fulda.API.csproj
  PUBLISH_DIR: ./publish/api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore "${{ env.API_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.API_PROJECT }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ env.API_PROJECT }}" --configuration Release --output "${{ env.PUBLISH_DIR }}" --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: api-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA454D5E85D84307844B8F2148FECA36 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ADEC5B8BA3BC4C9AAE3C8E5239A95870 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11A48DE01A6C4DE1AB051374D333C9C6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: flaudaa
          slot-name: Production
          package: api-app
