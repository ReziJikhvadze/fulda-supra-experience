name: deploy-flaudaa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build SPA
        working-directory: Fulda.API/Fulda.API/wwwroot
        run: npm ci && npm run build:azure
        env:
          VITE_API_URL: ""
      - name: Copy SPA into publish folder
        run: |
          rm -rf Fulda.API/Fulda.API/spa
          mkdir -p Fulda.API/Fulda.API/spa
          cp -r Fulda.API/Fulda.API/wwwroot/dist/azure/* Fulda.API/Fulda.API/spa/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
      - run: dotnet publish Fulda.API/Fulda.API/Fulda.API.csproj -c Release -o ./publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-app
          path: api-app
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA454D5E85D84307844B8F2148FECA36 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ADEC5B8BA3BC4C9AAE3C8E5239A95870 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11A48DE01A6C4DE1AB051374D333C9C6 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: flaudaa
          package: api-app
