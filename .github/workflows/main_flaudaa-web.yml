# Build static SPA for Azure App Service (flaudaa-web).
# Deploy uses a PUBLISH PROFILE for flaudaa-web (OIDC secrets from the API app only target flaudaa).

name: Build and deploy frontend to Azure Web App - flaudaa-web

on:
  push:
    branches:
      - main
    paths:
      - 'Fulda.API/Fulda.API/wwwroot/**'
      - '.github/workflows/main_flaudaa-web.yml'
  workflow_dispatch:

env:
  WEB_ROOT: Fulda.API/Fulda.API/wwwroot
  WEBAPP_NAME: flaudaa-web
  VITE_API_URL: https://flaudaa-dwf9bhg5e8g6bebv.canadacentral-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEB_ROOT }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build for Azure (static SPA)
        run: npm run build:azure
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Verify build output
        run: test -f dist/azure/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ${{ env.WEB_ROOT }}/dist/azure

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Deploy to Azure Web App (flaudaa-web)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web-app
