# Build static SPA for Azure App Service (flaudaa-web).
# Uses build:azure — NOT the default Cloudflare/TanStack Start worker build.

name: Build and deploy frontend to Azure Web App - flaudaa-web

on:
  push:
    branches:
      - main
    paths:
      - 'Fulda.API/Fulda.API/wwwroot/**'
      - '.github/workflows/main_flaudaa-web.yml'
  workflow_dispatch:

env:
  WEB_ROOT: Fulda.API/Fulda.API/wwwroot
  WEBAPP_NAME: flaudaa-web
  VITE_API_URL: https://flaudaa-dwf9bhg5e8g6bebv.canadacentral-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WEB_ROOT }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build for Azure (static SPA)
        run: npm run build:azure
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Verify build output
        run: test -f dist/azure/index.html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ${{ env.WEB_ROOT }}/dist/azure

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app
          path: web-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA454D5E85D84307844B8F2148FECA36 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ADEC5B8BA3BC4C9AAE3C8E5239A95870 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_11A48DE01A6C4DE1AB051374D333C9C6 }}

      - name: Deploy to Azure Web App (web)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: Production
          package: web-app
