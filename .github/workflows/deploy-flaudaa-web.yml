# Frontend only → Azure App Service flaudaa-web
# Builds static SPA in CI, installs "serve", deploys without Oryx rebuild.

name: deploy-flaudaa-web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEB_ROOT: Fulda.API/Fulda.API/wwwroot
  VITE_API_URL: https://flaudaa-dwf9bhg5e8g6bebv.canadacentral-01.azurewebsites.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WEB_ROOT }}/package-lock.json

      - name: Build SPA for flaudaa-web
        working-directory: ${{ env.WEB_ROOT }}
        run: npm ci && npm run build:azure
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Prepare deploy package (static + serve, no Oryx build)
        working-directory: ${{ env.WEB_ROOT }}/dist/azure
        run: |
          cp ../../azure-host/package.json .
          cp ../../azure-host/.deployment .
          npm install --omit=dev --no-audit --no-fund
          test -f index.html
          test -d assets
          echo "Package ready:"
          ls -la
          du -sh .

      - name: Deploy to flaudaa-web
        uses: azure/webapps-deploy@v3
        with:
          app-name: flaudaa-web
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.WEB_ROOT }}/dist/azure
